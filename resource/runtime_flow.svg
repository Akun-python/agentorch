<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" fill="none">
  <rect width="1280" height="860" fill="#F6F0E5"/>
  <text x="64" y="78" fill="#1F2937" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    agentorch Runtime Flow
  </text>
  <text x="64" y="114" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Requests can branch into retrieval, tools, workflow steps, or delegated specialist agents.
  </text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="72" y="186" width="170" height="74" rx="18" fill="#FDE5B0" stroke="#D89B35" stroke-width="2"/>
  <text x="112" y="232" fill="#7C4A03" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">User Input</text>

  <rect x="304" y="186" width="220" height="74" rx="18" fill="#DCEFE8" stroke="#69A78D" stroke-width="2"/>
  <text x="348" y="232" fill="#0F5132" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Runtime.run()</text>

  <rect x="602" y="92" width="260" height="74" rx="18" fill="#E7F0FF" stroke="#6B96C9" stroke-width="2"/>
  <text x="648" y="138" fill="#153E75" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Retrieval Context</text>

  <rect x="602" y="286" width="260" height="74" rx="18" fill="#E3F0D3" stroke="#8AAE56" stroke-width="2"/>
  <text x="648" y="332" fill="#375623" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Memory Context</text>

  <rect x="936" y="186" width="244" height="74" rx="18" fill="#E4E9FF" stroke="#6A7ED6" stroke-width="2"/>
  <text x="974" y="232" fill="#27346C" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">PromptBuilder</text>

  <rect x="72" y="432" width="220" height="74" rx="18" fill="#E4E9FF" stroke="#6A7ED6" stroke-width="2"/>
  <text x="116" y="478" fill="#27346C" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Model.generate()</text>

  <rect x="352" y="432" width="220" height="74" rx="18" fill="#FFE1D9" stroke="#D86F58" stroke-width="2"/>
  <text x="424" y="478" fill="#7A271A" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Tool Call</text>

