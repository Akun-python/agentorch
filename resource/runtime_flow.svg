  <text x="394" y="656" fill="#7A271A" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Sandbox / Tools</text>

  <rect x="640" y="424" width="236" height="90" rx="20" fill="#F0E0FF" stroke="#9B63D1" stroke-width="3"/>
  <text x="682" y="470" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Delegate Agent</text>
  <text x="674" y="498" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="16">first-class multi-agent branch</text>

  <rect x="630" y="592" width="392" height="144" rx="24" fill="#F0E0FF" stroke="#9B63D1" stroke-width="3"/>
  <text x="658" y="638" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Multi-Agent Control</text>
  <text x="658" y="676" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="20">Supervisor / AgentRegistry</text>
  <text x="658" y="708" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="20">TaskPacket / Handoff</text>
  <text x="658" y="740" fill="#5B2B85" font-family="Segoe UI, Arial, sans-serif" font-size="20">Specialist Agents / Aggregated Outputs</text>

  <rect x="960" y="432" width="172" height="74" rx="18" fill="#FFF0D8" stroke="#D89B35" stroke-width="2"/>
  <text x="1004" y="478" fill="#7C4A03" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Finish</text>

