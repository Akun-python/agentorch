<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">agentorch conductor icon</title>
  <desc id="desc">Minimal symphony conductor symbol orchestrating an arc of agent nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="170" x2="328" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)"/>

  <!-- Orchestra arc -->
  <path d="M116 344C180 396 332 396 396 344" fill="none" stroke="#94A3B8" stroke-width="11" stroke-linecap="round"/>
  <g fill="#2563EB">
    <circle cx="148" cy="342" r="10"/>
    <circle cx="204" cy="362" r="10"/>
    <circle cx="256" cy="370" r="10"/>
    <circle cx="308" cy="362" r="10"/>
    <circle cx="364" cy="342" r="10"/>
  </g>

  <!-- Conductor -->
  <circle cx="256" cy="170" r="24" fill="url(#accent)"/>
  <path d="M256 198V288" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 234L198 270" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 232L322 196" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

  <!-- Baton -->
  <path d="M322 196L390 152" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="395" cy="148" r="6" fill="#0F172A"/>

  <!-- Guiding curve -->
  <path d="M168 300C220 334 292 334 344 300" fill="none" stroke="#BFDBFE" stroke-width="8" stroke-linecap="round"/>
</svg>
