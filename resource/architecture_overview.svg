<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">agentorch Architecture Overview</title>
  <desc id="desc">Minimal layered architecture diagram for agentorch with explicit orchestration core and multi-agent coordination.</desc>

  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 38px; font-weight: 700; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 400; }
      .layer-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .text { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 400; }
      .chip { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 500; }
    </style>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11L3 5.5Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1440" height="980" fill="#F8FAFC"/>
  <rect x="36" y="30" width="1368" height="920" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <text x="78" y="90" class="title" fill="#0F172A">agentorch Architecture Overview</text>
  <text x="78" y="124" class="subtitle" fill="#475569">
    Code-first runtime for explicit tools, workflow execution, retrieval, memory, and multi-agent orchestration.
  </text>
  <rect x="1118" y="74" width="238" height="40" rx="20" fill="#EEF4FF" stroke="#BFDBFE"/>
  <text x="1237" y="100" text-anchor="middle" class="chip" fill="#1D4ED8">Minimal, Inspectable Runtime</text>

  <g stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M390 244H442" marker-end="url(#arrow)"/>
    <path d="M998 244H1050" marker-end="url(#arrow)"/>
    <path d="M240 322V384" marker-end="url(#arrow)"/>
    <path d="M720 322V384" marker-end="url(#arrow)"/>
    <path d="M1200 322V384" marker-end="url(#arrow)"/>
    <path d="M720 532V594" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="164" width="312" height="160" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="106" y="210" class="layer-title" fill="#0F172A">Application Layer</text>
    <text x="106" y="248" class="text" fill="#334155">
      <tspan x="106" dy="0">create_agent / create_multi_agent</tspan>
      <tspan x="106" dy="27">AgentDesign / TeamDesign</tspan>
      <tspan x="106" dy="27">Workflow / Supervisor entrypoints</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="442" y="164" width="556" height="160" rx="20" fill="#EEF4FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="472" y="210" class="layer-title" fill="#1E3A8A">Orchestration Core</text>
    <text x="472" y="248" class="text" fill="#1F2937">
      <tspan x="472" dy="0">Runtime / Agent / ContextKernel</tspan>
      <tspan x="472" dy="27">Prompt assembly / workflow execution</tspan>
      <tspan x="472" dy="27">Policies / tracing / extensions</tspan>
    </text>
    <text x="742" y="248" class="text" fill="#1F2937">
      <tspan x="742" dy="0">Reasoning frameworks</tspan>
      <tspan x="742" dy="27">TaskPacket / Handoff</tspan>
      <tspan x="742" dy="27">Delegation and routing</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="164" width="306" height="160" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1078" y="210" class="layer-title" fill="#0F172A">Model Layer</text>
    <text x="1078" y="248" class="text" fill="#334155">
      <tspan x="1078" dy="0">ModelConfig / provider registry</tspan>
      <tspan x="1078" dy="27">OpenAI-compatible adapters</tspan>
      <tspan x="1078" dy="27">Streaming / media / tool calls</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="384" width="372" height="148" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="106" y="428" class="layer-title" fill="#0F172A">Action Systems</text>
    <text x="106" y="462" class="text" fill="#334155">
      <tspan x="106" dy="0">ToolRegistry / @tool decorator</tspan>
      <tspan x="106" dy="26">Filesystem / Git / Web / Media</tspan>
      <tspan x="106" dy="26">SandboxManager / Python worker</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="534" y="384" width="372" height="148" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="562" y="428" class="layer-title" fill="#0F172A">State Systems</text>
    <text x="562" y="462" class="text" fill="#334155">
      <tspan x="562" dy="0">MemoryManager / mechanisms</tspan>
      <tspan x="562" dy="26">Thread state / workspace records</tspan>
      <tspan x="562" dy="26">Collective memory governance</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="384" width="366" height="148" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1018" y="428" class="layer-title" fill="#0F172A">Knowledge Systems</text>
    <text x="1018" y="462" class="text" fill="#334155">
      <tspan x="1018" dy="0">IndexedKnowledgeBase / adapters</tspan>
      <tspan x="1018" dy="26">Classic / deliberative / hybrid RAG</tspan>
      <tspan x="1018" dy="26">Citations / evidence reports</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="594" width="1278" height="252" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="108" y="646" class="layer-title" fill="#0F172A">Multi-Agent Layer</text>
    <text x="108" y="682" class="text" fill="#334155">
      Explicit team orchestration for scoped delegation, shared state, inspectable handoffs, and low-token collaboration.
    </text>

    <rect x="108" y="710" width="262" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="239" y="735" text-anchor="middle" class="chip" fill="#334155">AgentRegistry / AgentSpec</text>

    <rect x="392" y="710" width="240" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="512" y="735" text-anchor="middle" class="chip" fill="#334155">TaskPacket / Handoff</text>

    <rect x="654" y="710" width="230" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="769" y="735" text-anchor="middle" class="chip" fill="#334155">Supervisor / Coordinator</text>

    <rect x="906" y="710" width="206" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="1009" y="735" text-anchor="middle" class="chip" fill="#334155">CoordinationPolicy</text>

    <rect x="1134" y="710" width="192" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="1230" y="735" text-anchor="middle" class="chip" fill="#334155">MemoryPolicy</text>

    <rect x="204" y="766" width="236" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="322" y="791" text-anchor="middle" class="chip" fill="#334155">Specialist agents</text>

    <rect x="464" y="766" width="230" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="579" y="791" text-anchor="middle" class="chip" fill="#334155">Workflow agent nodes</text>

    <rect x="718" y="766" width="220" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="828" y="791" text-anchor="middle" class="chip" fill="#334155">Shared knowledge</text>

    <rect x="962" y="766" width="230" height="38" rx="19" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="1077" y="791" text-anchor="middle" class="chip" fill="#334155">Aggregated outputs</text>
  </g>

  <rect x="78" y="872" width="1278" height="46" rx="23" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="108" y="902" class="text" fill="#475569">
    Extension surface: skills | plugins | custom retrievers | custom policies | sandbox backends | runtime hooks
  </text>
</svg>
