<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">agentorch Architecture Overview</title>
  <desc id="desc">Minimal commander-led multi-agent orchestration map.</desc>
  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 40px; font-weight: 700; }
      .sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 400; }
      .head { font-family: "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .body { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 400; }
      .chip { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-12%" y="-14%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10L2.5 5Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1368" height="844" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="78" y="92" class="title" fill="#0F172A">agentorch Architecture Overview</text>
  <text x="78" y="124" class="sub" fill="#475569">A single commander orchestrates tools, memory, knowledge, and worker agents.</text>
  <rect x="1162" y="66" width="194" height="38" rx="19" fill="#EEF4FF" stroke="#BFDBFE"/>
  <text x="1259" y="90" text-anchor="middle" class="chip" fill="#1D4ED8">v0.1.0 runtime map</text>
  <g filter="url(#shadow)">
    <rect x="510" y="170" width="420" height="142" rx="24" fill="#EEF4FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="540" y="223" class="head" fill="#1E3A8A">Commander</text>
    <text x="540" y="257" class="body" fill="#1F2937">Plans tasks, enforces policy, and coordinates delegation.</text>
  </g>
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M720 312V372" marker-end="url(#arrow)"/>
    <path d="M620 312L438 388" marker-end="url(#arrow)"/>
    <path d="M820 312L1002 388" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="130" y="392" width="280" height="124" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="160" y="438" class="head" fill="#0F172A">Tools</text>
    <text x="160" y="468" class="body" fill="#334155">Filesystem, shell, web, custom skills.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="392" width="280" height="124" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="460" y="438" class="head" fill="#0F172A">Memory</text>
    <text x="460" y="468" class="body" fill="#334155">Thread state and workspace context.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="392" width="280" height="124" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="760" y="438" class="head" fill="#0F172A">Knowledge</text>
    <text x="760" y="468" class="body" fill="#334155">RAG strategies with evidence outputs.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1030" y="392" width="280" height="124" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1060" y="438" class="head" fill="#0F172A">Workflow</text>
    <text x="1060" y="468" class="body" fill="#334155">Deterministic DAG and handoff control.</text>
  </g>
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M270 516V580" marker-end="url(#arrow)"/>
    <path d="M570 516V580" marker-end="url(#arrow)"/>
    <path d="M870 516V580" marker-end="url(#arrow)"/>
    <path d="M1170 516V580" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="180" y="604" width="1080" height="190" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="220" y="658" class="head" fill="#0F172A">Worker Agents</text>
    <text x="220" y="690" class="body" fill="#334155">Specialists execute scoped tasks under commander supervision.</text>
    <rect x="220" y="714" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="308" y="737" text-anchor="middle" class="chip" fill="#334155">Researcher</text>
    <rect x="418" y="714" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="506" y="737" text-anchor="middle" class="chip" fill="#334155">Coder</text>
    <rect x="616" y="714" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="704" y="737" text-anchor="middle" class="chip" fill="#334155">Reviewer</text>
    <rect x="814" y="714" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="902" y="737" text-anchor="middle" class="chip" fill="#334155">Operator</text>
    <rect x="1012" y="714" width="208" height="36" rx="18" fill="#FFFFFF" stroke="#D6E3F8"/>
    <text x="1116" y="737" text-anchor="middle" class="chip" fill="#334155">Shared Memory Bus</text>
  </g>
  <rect x="78" y="818" width="1278" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="108" y="844" class="body" fill="#64748B">Extension surface: plugins, skills, retrievers, runtime hooks.</text>
</svg>
