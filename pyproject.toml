[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorch"
version = "0.1.0"
description = "Code-first async-first agent orchestration framework for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
  { name = "Guangpeng Sun", email = "2303907916@qq.com" }
]
dependencies = [
  "openai>=1.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Akun-python/agentorch"
Repository = "https://github.com/Akun-python/agentorch"
Issues = "https://github.com/Akun-python/agentorch/issues"
